id: US-RES-SPT
jurisdiction: US
tax_year: "2026"

sources:
  - id: US-IRC-7701B
    section: "7701(b)(3)"
    passage: >-
      An individual meets the substantial presence test for a calendar year if
      present in the United States on at least 31 days during the year, and the
      sum of days present in the year, one-third of days in the first preceding
      year, and one-sixth of days in the second preceding year equals or
      exceeds 183 days.

summary: >-
  US resident for the year if present at least 31 days this year and the
  weighted three-year total (this year + 1/3 last year + 1/6 the year before)
  is at least 183 days.

inputs:
  - name: days_in_us
    type: integer
  - name: days_in_us_prev1
    type: integer
  - name: days_in_us_prev2
    type: integer

logic:
  kind: all_of
  conditions:
    - { kind: threshold, input: days_in_us, operator: ">=", threshold: 31 }
    - kind: weighted_sum
      terms:
        - { input: days_in_us, weight: 1 }
        - { input: days_in_us_prev1, weight: 0.3333333333 }
        - { input: days_in_us_prev2, weight: 0.1666666667 }
      operator: ">="
      threshold: 183
  returns:
    true: RESIDENT
    false: NOT_RESIDENT_BY_THIS_TEST

status: pending_validation

notes: >-
  Prototype rule pending validation. Exempt-individual days (e.g. F/J visas),
  the closer-connection exception and treaty tie-breakers are not modelled.

test_cases:
  - name: "Full year in the US"
    inputs: { days_in_us: 330, days_in_us_prev1: 330, days_in_us_prev2: 330 }
    expected: true
  - name: "Left early: 120 days this year after full years"
    inputs: { days_in_us: 120, days_in_us_prev1: 340, days_in_us_prev2: 340 }
    expected: true
  - name: "Under 31 days"
    inputs: { days_in_us: 20, days_in_us_prev1: 365, days_in_us_prev2: 365 }
    expected: false
