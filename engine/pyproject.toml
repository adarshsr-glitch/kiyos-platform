[project]
name = "kiyos-engine"
version = "0.1.0"
description = "Kiyos deterministic tax calculation engine"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["engine*"]
